<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Area 75 — Alcoholics Anonymous in Southern Wisconsin</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    /* ── TOKENS ─────────────────────────────────────────── */
    :root {
      /* Midnight Blue zone (navbar, footer, hero, cards) */
      --blue:        #191970;
      --blue-mid:    #1a1a80;
      --blue-light:  #20208f;
      --blue-border: #2e2ea0;
      --on-blue:     #FFFACD;   /* pale yellow text on blue */
      --on-blue-dim: #c8bc5a;   /* muted yellow on blue */

      /* Pale Yellow zone (main content area) */
      --yellow:      #FFFACD;
      --on-yellow:   #1a1a40;   /* dark navy text on yellow */
      --on-yellow-dim: #4a4a7a; /* muted navy on yellow */
      --yellow-border: #c0ba78; /* subtle border on yellow bg */

      /* Accent (crimson red — works on both zones) */
      --accent:      #C0392B;   /* rich crimson — visible on midnight blue */
      --accent-dark: #8B0000;   /* dark red — readable on pale yellow */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--yellow);
      color: var(--on-yellow);
      font-family: 'Georgia', 'Times New Roman', serif;
      line-height: 1.7;
      min-height: 100vh;
    }
    a { color: var(--accent-dark); text-decoration: none; }
    a:hover { text-decoration: underline; }
    #root { display: flex; flex-direction: column; min-height: 100vh; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--blue-mid); }
    ::-webkit-scrollbar-thumb { background: var(--blue-border); border-radius: 3px; }

    /* ── NAVBAR (midnight blue) ─────────────────────────── */
    .navbar {
      background: var(--blue);
      border-bottom: 2px solid var(--blue-border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(0,0,0,0.5);
    }
    .navbar-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    .navbar-brand {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      user-select: none;
    }
    .navbar-brand .brand-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent);
      letter-spacing: 0.04em;
      line-height: 1.2;
    }
    .navbar-brand .brand-sub {
      font-size: 0.7rem;
      color: var(--on-blue-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      list-style: none;
    }
    .nav-item { position: relative; }
    .nav-btn {
      background: none;
      border: none;
      color: var(--on-blue);
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.45rem 0.75rem;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
    }
    .nav-btn:hover, .nav-btn.active {
      background: var(--blue-light);
      color: var(--accent);
    }
    .nav-btn .chevron { font-size: 0.6rem; opacity: 0.6; transition: transform 0.2s; }
    .nav-btn.open .chevron { transform: rotate(180deg); }
    .nav-ext { font-size: 0.65rem; opacity: 0.6; }

    /* Dropdown (midnight blue) */
    .dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      background: var(--blue-light);
      border: 1px solid var(--blue-border);
      border-radius: 8px;
      min-width: 220px;
      padding: 0.4rem 0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      animation: fadeDown 0.15s ease;
      z-index: 200;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .dropdown-section-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--on-blue-dim);
      padding: 0.6rem 1rem 0.2rem;
    }
    .dropdown-item {
      display: block;
      width: 100%;
      background: none;
      border: none;
      text-align: left;
      color: var(--on-blue);
      font-family: inherit;
      font-size: 0.83rem;
      padding: 0.45rem 1rem;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }
    .dropdown-item:hover { background: var(--blue-mid); color: var(--accent); }
    .dropdown-divider { border: none; border-top: 1px solid var(--blue-border); margin: 0.3rem 0; }

    /* Mobile hamburger */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
    }
    .hamburger span {
      display: block;
      width: 22px;
      height: 2px;
      background: var(--on-blue);
      border-radius: 2px;
      transition: all 0.2s;
    }

    /* Mobile nav (midnight blue) */
    .mobile-nav {
      background: var(--blue-mid);
      border-top: 1px solid var(--blue-border);
      padding: 1rem 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .mobile-section-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--on-blue-dim);
      padding: 0.8rem 0 0.3rem;
    }
    .mobile-nav-item {
      background: none;
      border: none;
      text-align: left;
      color: var(--on-blue);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.5rem 0.5rem;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.1s, color 0.1s;
    }
    .mobile-nav-item:hover { background: var(--blue-light); color: var(--accent); }

    /* ── HERO (midnight blue, same zone as navbar) ──────── */
    .hero {
      background: linear-gradient(160deg, #191970 0%, #1e1e90 50%, #191970 100%);
      border-bottom: 3px solid var(--accent);
      padding: 4rem 1.5rem 3.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,250,205,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      color: var(--on-blue);
      letter-spacing: 0.02em;
      margin-bottom: 0.5rem;
    }
    .hero h1 span { color: var(--accent); }
    .hero p {
      font-size: 1rem;
      color: var(--on-blue-dim);
      max-width: 560px;
      margin: 0 auto 1.5rem;
    }
    .hero-btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 0.9rem;
      padding: 0.65rem 1.6rem;
      border-radius: 30px;
      font-family: inherit;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-weight: bold;
      letter-spacing: 0.03em;
    }
    .hero-btn:hover { background: #8B0000; transform: translateY(-1px); }

    /* ── EVENTS STRIP (pale yellow, same as main) ───────── */
    .events-strip {
      background: var(--yellow);
      border-bottom: 1px solid var(--yellow-border);
      padding: 2rem 1.5rem;
    }
    .events-strip-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
    }

    /* ── CARDS (midnight blue on pale yellow background) ── */
    .event-card {
      background: var(--blue);
      border: 1px solid var(--blue-border);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 1rem 1.2rem;
    }
    .event-date {
      font-size: 0.72rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-family: 'Arial', sans-serif;
      margin-bottom: 0.3rem;
      font-weight: bold;
    }
    .event-title {
      font-size: 1rem;
      font-weight: bold;
      color: var(--on-blue);
      margin-bottom: 0.25rem;
    }
    .event-loc {
      font-size: 0.8rem;
      color: var(--on-blue-dim);
      line-height: 1.5;
    }

    /* ── MAIN CONTENT (pale yellow) ─────────────────────── */
    .main { flex: 1; background: var(--yellow); }
    .content-wrapper {
      max-width: 820px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    /* Page header */
    .page-header {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--yellow-border);
    }
    .page-header h1 {
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      color: var(--on-yellow);
    }
    .page-header h1 span { color: var(--accent-dark); }
    .page-subtitle {
      color: var(--on-yellow-dim);
      font-size: 0.9rem;
      margin-top: 0.3rem;
    }

    /* Prose (on pale yellow background → dark text) */
    .prose { font-size: 0.97rem; color: var(--on-yellow); }
    .prose h2 {
      font-size: 1.25rem;
      color: var(--blue);
      margin: 2rem 0 0.7rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--yellow-border);
    }
    .prose h3 {
      font-size: 1.05rem;
      color: var(--on-yellow);
      margin: 1.4rem 0 0.4rem;
    }
    .prose p { margin-bottom: 1rem; color: var(--on-yellow); }
    .prose ul, .prose ol { padding-left: 1.5rem; margin-bottom: 1rem; }
    .prose li { margin-bottom: 0.4rem; color: var(--on-yellow); }
    .prose strong { color: var(--on-yellow); }
    .prose .cite {
      font-size: 0.8rem;
      color: var(--on-yellow-dim);
      font-style: italic;
      margin-top: 1rem;
      display: block;
    }
    .prose a { color: var(--accent-dark); font-weight: bold; }
    .prose a:hover { text-decoration: underline; }

    /* Numbered list (midnight blue cards on yellow page) */
    .numbered-list {
      list-style: none;
      padding: 0;
      counter-reset: item;
    }
    .numbered-list li {
      counter-increment: item;
      display: flex;
      gap: 1rem;
      padding: 0.8rem 1rem;
      margin-bottom: 0.5rem;
      background: var(--blue);
      color: var(--on-blue);
      border: 1px solid var(--blue-border);
      border-radius: 8px;
      align-items: flex-start;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .numbered-list li:hover { border-color: var(--accent); box-shadow: 0 2px 12px rgba(25,25,112,0.3); }
    .numbered-list li::before {
      content: counter(item);
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      font-family: 'Arial', sans-serif;
      font-weight: bold;
      min-width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* Info card (midnight blue on yellow page) */
    .info-card {
      background: var(--blue);
      border: 1px solid var(--blue-border);
      border-radius: 10px;
      padding: 1.2rem 1.4rem;
      margin-bottom: 1.2rem;
      color: var(--on-blue);
    }
    .info-card h3 {
      color: var(--accent);
      font-size: 1rem;
      margin-bottom: 0.4rem;
    }
    .info-card p, .info-card address {
      font-size: 0.88rem;
      color: var(--on-blue-dim);
      font-style: normal;
      line-height: 1.8;
    }
    .info-card a { color: var(--accent); font-weight: bold; }
    .info-card strong { color: var(--on-blue); }

    /* Alert banner (midnight blue on yellow page) */
    .alert-banner {
      background: var(--blue);
      border: 2px solid var(--accent);
      border-radius: 8px;
      padding: 1rem 1.2rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: var(--on-blue);
    }
    .alert-banner strong { color: var(--accent); }

    /* Resource links (midnight blue on yellow page) */
    .resource-link {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.65rem 1rem;
      background: var(--blue);
      border: 1px solid var(--blue-border);
      border-radius: 6px;
      margin-bottom: 0.5rem;
      color: var(--on-blue);
      font-size: 0.88rem;
      transition: border-color 0.15s, background 0.15s;
      text-decoration: none;
    }
    .resource-link:hover { border-color: var(--accent); background: var(--blue-light); color: var(--on-blue); text-decoration: none; }
    .resource-link::before { content: '→'; color: var(--accent); font-size: 0.9rem; font-weight: bold; }

    /* Quote block (midnight blue on yellow page) */
    .blockquote {
      border-left: 4px solid var(--accent);
      padding: 0.8rem 1.2rem;
      background: var(--blue);
      color: var(--on-blue-dim);
      border-radius: 0 8px 8px 0;
      margin: 1.2rem 0;
      font-style: italic;
    }
    .blockquote strong { color: var(--on-blue); }

    /* Section divider (on yellow) */
    .section-divider {
      border: none;
      border-top: 1px solid var(--yellow-border);
      margin: 2rem 0;
    }

    /* Inline committee grid */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 600px) { .two-col { grid-template-columns: 1fr; } }

    /* ── FOOTER (midnight blue) ─────────────────────────── */
    footer {
      background: var(--blue);
      border-top: 2px solid var(--blue-border);
      padding: 2rem 1.5rem;
      text-align: center;
      color: var(--on-blue-dim);
      font-size: 0.8rem;
    }
    footer a { color: var(--accent); }
    .footer-inner { max-width: 1100px; margin: 0 auto; }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .footer-links button {
      background: none;
      border: none;
      color: var(--on-blue-dim);
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.15s;
    }
    .footer-links button:hover { color: var(--accent); }

    /* ── MEETINGS PAGE ──────────────────────────────────── */
    .meetings-intro {
      background: var(--blue);
      border-bottom: 3px solid var(--accent);
      padding: 2.5rem 1.5rem;
      text-align: center;
    }
    .meetings-intro h1 { color: var(--on-blue); font-size: clamp(1.6rem,3vw,2.4rem); margin-bottom: 0.4rem; }
    .meetings-intro h1 span { color: var(--accent); }
    .meetings-intro p { color: var(--on-blue-dim); max-width: 600px; margin: 0 auto; }
    .meetings-meta {
      max-width: 900px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }
    .meeting-type-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px,1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .meeting-type-card {
      background: var(--blue);
      border: 1px solid var(--blue-border);
      border-top: 3px solid var(--accent);
      border-radius: 8px;
      padding: 1.1rem 1.3rem;
    }
    .meeting-type-card h3 { color: var(--accent); font-size: 0.95rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .meeting-type-card p { color: var(--on-blue-dim); font-size: 0.87rem; margin: 0; }

    /* ── EVENTS PAGE ─────────────────────────────────────── */
    .events-page-header {
      background: var(--blue);
      border-bottom: 3px solid var(--accent);
      padding: 2.5rem 1.5rem;
      text-align: center;
    }
    .events-page-header h1 { color: var(--on-blue); font-size: clamp(1.6rem,3vw,2.4rem); margin-bottom: 0.4rem; }
    .events-page-header h1 span { color: var(--accent); }
    .events-page-header p { color: var(--on-blue-dim); max-width: 560px; margin: 0 auto; }
    .events-content { max-width: 960px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px,1fr));
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }
    .event-full-card {
      background: var(--blue);
      border: 1px solid var(--blue-border);
      border-radius: 10px;
      overflow: hidden;
    }
    .event-full-card-top {
      background: var(--accent);
      padding: 0.7rem 1.2rem;
    }
    .event-full-card-top .date-label { color: #fff; font-size: 0.8rem; font-weight: bold; letter-spacing: 0.06em; text-transform: uppercase; font-family: Arial, sans-serif; }
    .event-full-card-body { padding: 1.1rem 1.2rem; }
    .event-full-card-body h3 { color: var(--on-blue); font-size: 1.05rem; margin-bottom: 0.5rem; }
    .event-full-card-body .location { color: var(--on-blue-dim); font-size: 0.85rem; line-height: 1.6; }
    .event-full-card-body .location strong { color: var(--on-blue); display: block; margin-bottom: 0.1rem; }

    /* Mini calendar */
    .calendars-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }
    .mini-cal {
      background: var(--blue);
      border: 1px solid var(--blue-border);
      border-radius: 10px;
      overflow: hidden;
    }
    .mini-cal-header {
      background: var(--blue-light);
      padding: 0.6rem 1rem;
      text-align: center;
      color: var(--on-blue);
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--blue-border);
    }
    .mini-cal-dow {
      display: grid;
      grid-template-columns: repeat(7,1fr);
      padding: 0.4rem 0.5rem 0.2rem;
    }
    .mini-cal-dow span {
      text-align: center;
      font-size: 0.65rem;
      color: var(--on-blue-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .mini-cal-days {
      display: grid;
      grid-template-columns: repeat(7,1fr);
      padding: 0 0.5rem 0.7rem;
      gap: 2px;
    }
    .cal-day {
      text-align: center;
      font-size: 0.78rem;
      padding: 0.25rem 0;
      border-radius: 50%;
      color: var(--on-blue-dim);
      line-height: 1.6;
    }
    .cal-day.today { background: var(--blue-light); color: var(--on-blue); font-weight: bold; }
    .cal-day.has-event {
      background: var(--accent);
      color: #fff;
      font-weight: bold;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }
    .cal-day.event-range {
      background: rgba(192,57,43,0.25);
      color: var(--on-blue);
      border-radius: 0;
    }
    .cal-day.event-range-start { border-radius: 50% 0 0 50%; }
    .cal-day.event-range-end { border-radius: 0 50% 50% 0; }
    .cal-day.faded { color: rgba(255,250,205,0.2); }

    /* ── THEME SELECTOR ─────────────────────────────────── */
    .theme-selector {
      background: var(--blue);
      border: 1px solid var(--blue-border);
      border-radius: 12px;
      padding: 1.2rem 1.4rem;
      margin-bottom: 2rem;
    }
    .theme-selector-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--on-blue-dim);
      margin-bottom: 1rem;
      font-family: Arial, sans-serif;
    }
    .theme-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.45rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .theme-row:last-child { border-bottom: none; }
    .theme-swatches {
      display: flex;
      gap: 3px;
      flex-shrink: 0;
    }
    .theme-swatch {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.25);
      display: inline-block;
      flex-shrink: 0;
    }
    .theme-label {
      flex: 1;
      font-size: 0.82rem;
      color: var(--on-blue);
      font-family: Arial, sans-serif;
    }
    .theme-label small {
      display: block;
      font-size: 0.68rem;
      color: var(--on-blue-dim);
      margin-top: 1px;
    }
    .theme-mode-btns {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .theme-mode-btn {
      background: transparent;
      border: 1px solid var(--blue-border);
      color: var(--on-blue-dim);
      font-size: 0.72rem;
      font-family: Arial, sans-serif;
      padding: 0.22rem 0.6rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .theme-mode-btn:hover { border-color: var(--accent); color: var(--on-blue); }
    .theme-mode-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: bold;
    }

    /* ── RESPONSIVE ─────────────────────────────────────── */
    @media (max-width: 768px) {

function WhatIsAAPage() {
  return (
    <div className="content-wrapper">
      <div className="page-header">
        <h1>What is <span style={{color:"var(--accent-dark)"}}>Alcoholics Anonymous?</span></h1>
      </div>
      <div className="prose">
        <p>
          Alcoholics Anonymous is a voluntary, worldwide fellowship of men and women from all walks of life
          who meet together to attain and maintain sobriety. The only requirement for membership is a desire
          to stop drinking. There are no dues or fees for A.A. membership.
        </p>
        <span className="cite">Reprinted from: A.A. at a Glance, P-1, with permission of A.A. World Services Inc.</span>

        <h2>How Does A.A. Help the Alcoholic?</h2>
        <p>
          Through the example and friendship of the recovered alcoholics in A.A., new members are encouraged
          to stay away from a drink "one day at a time," as everyone in A.A. does. Instead of "swearing off
          forever" or worrying about whether they will be sober tomorrow, people in A.A. concentrate on not
          drinking right now — today.
        </p>
        <p>
          By keeping alcohol out of their systems, newcomers take care of one part of their illness. There is
          another part. If they are going to stay sober, they need healthy minds and healthy emotions, too. So
          they begin to straighten out their confused thinking and unhappy feelings by following A.A.'s
          "Twelve Steps" to recovery.
        </p>

        <h2>What is an A.A. Meeting?</h2>
        <p>There are generally two types of A.A. meetings — open meetings and closed meetings.</p>
        <p>
          At <strong>open meetings</strong>, speakers tell how they drank, how they came to A.A., and how its
          program of recovery has helped them. Members may bring relatives or friends, and usually anyone
          interested in A.A. is also welcome.
        </p>
        <p>
          <strong>Closed meetings</strong> are for alcoholics only. These are group discussions where any member
          who wants to may speak up, ask questions, and share thoughts with fellow members.
        </p>

        <h2>Why is A.A. "Anonymous"?</h2>
        <p>
          Over the years, anonymity has proved one of the greatest gifts that A.A. offers the suffering
          alcoholic. Without it, many would never attend their first meeting. Anonymity is essential for
          an atmosphere of trust and openness.
        </p>
        <p>
          Anonymity serves two different yet equally vital functions. First, at the personal level, it provides
          protection for all members from identification as alcoholics. Secondly, at the level of press, radio,
          TV, and films, anonymity stresses the equality in the Fellowship of all members.
        </p>

        <h2>Who Runs A.A.?</h2>
        <p>
          A.A. has no real government. Each group or meeting is free to work out its own customs and ways of
          holding meetings, as long as it does not hurt other groups or A.A. as a whole. A.A. group officers
          do not give orders — their job is to see that the group runs smoothly.
        </p>
        <p>Groups in the same area may set up a central office or "intergroup" office, and groups everywhere
          share their experiences by writing to the A.A. General Service Office in New York City.</p>

        <h2>What A.A. Does Not Do</h2>
        <ul>
          {[
            "A.A. does not run membership drives to argue alcoholics into joining.",
            "A.A. does not check up on its members to see that they don't drink.",
            "A.A. is not a religious organization.",
            "A.A. is not a medical organization and does not give out medicines or psychiatric advice.",
            "A.A. does not run hospitals, wards, or sanitariums.",
            "A.A. is not connected with any other organization.",
            "A.A. does not accept money from sources outside A.A."
          ].map((item, i) => <li key={i}>{item}</li>)}
        </ul>

        <h2>Where to Get More Information</h2>
        <p>This web site includes telephone numbers for local A.A. central offices and intergroups in
          southern Wisconsin. You may also contact:</p>
        <div className="info-card">
          <h3>A.A. General Service Office</h3>
          <address>
            Box 459, Grand Central Station<br/>
            New York, NY 10163<br/>
            (212) 870-3400<br/>
            <a href="https://www.aa.org" target="_blank" rel="noreferrer">www.aa.org</a>
          </address>
        </div>

        <span className="cite">Reprinted from: A Brief Guide to Alcoholics Anonymous, P-42, copyright 1972, Alcoholics Anonymous World Services, Inc.</span>
      </div>
    </div>
  );
}

          Spanish-speaking A.A. groups. Officers are elected from the membership in even-numbered years,
          including a chairperson, alternate chairperson, delegate, alternate delegate, secretary, alternate
          secretary, treasurer, and alternate treasurer. The term of office is two years.

function MiniCal({ year, month, highlightDays = [], rangeDays = [] }) {
  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const dow = ["Su","Mo","Tu","We","Th","Fr","Sa"];
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = new Date();
  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  function classFor(d) {
    if (!d) return "cal-day faded";
    if (highlightDays.includes(d)) return "cal-day has-event";
    const rangeInfo = rangeDays.find(r => d >= r.start && d <= r.end);
    if (rangeInfo) {
      if (d === rangeInfo.start) return "cal-day event-range event-range-start";
      if (d === rangeInfo.end)   return "cal-day event-range event-range-end";
      return "cal-day event-range";
    }
    if (today.getFullYear() === year && today.getMonth() === month && today.getDate() === d) return "cal-day today";
    return "cal-day";
  }

  return (
    <div className="mini-cal">
      <div className="mini-cal-header">{monthNames[month]} {year}</div>
      <div className="mini-cal-dow">{dow.map(d => <span key={d}>{d}</span>)}</div>
      <div className="mini-cal-days">
        {cells.map((d, i) => (
          <div key={i} className={classFor(d)}>{d || ""}</div>
        ))}
      </div>
    </div>
  );
}

  const [themeId, setThemeId] = useState("original");

  useEffect(() => {
    const root = document.documentElement;
    // Collect all possible variable names across all themes so we can cleanly reset
    const allVars = new Set(
      Object.values(THEMES).flatMap(t => Object.keys(t.vars))
    );
    // Clear every var first (restores :root defaults)
    allVars.forEach(v => root.style.removeProperty(v));
    // Apply the chosen theme's overrides
    const theme = THEMES[themeId];
    if (theme) {
      Object.entries(theme.vars).forEach(([k, v]) => root.style.setProperty(k, v));
    }
  }, [themeId]);

  return (
    <div id="root">
      <Navbar page={page} setPage={setPage}/>
      <main className="main">
        <PageContent page={page} navigate={setPage} themeId={themeId} setThemeId={setThemeId}/>
      </main>
      <Footer setPage={setPage}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
